<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegí tu nombre · PrecioScan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#1A1A1A">

  <link rel="icon" href="img/icon-192.png" type="image/png">
</head>
<body>
  <header class="encabezado">
    <div class="container">
      <div class="encabezado__fila"><span class="encabezado__logo"><img src="img/logo.png" alt="PrecioScan"></span></div>
    </div>
  </header>

  <main class="container contenido">
    <form class="formulario text-center" action="inicio.html">
      <h1 class="titulo-pagina">¿Cómo querés que te llamemos?</h1>
      <p class="texto-secundario">Así vas a aparecer arriba a la derecha:</p>

      <div class="muestra">
        <img class="muestra__logo" src="img/logo.png" alt="PrecioScan">
        <span class="usuario"><span class="usuario__avatar inicial-usuario">G</span><span class="muestra__nombre nombre-usuario">Galo</span></span>
      </div>

      <label class="formulario__etiqueta" for="nombre">Tu nombre</label>
      <input class="formulario__campo" type="text" id="nombre" value="Galo" required>
      <button type="submit" class="boton boton--amarillo boton--ancho">Guardar y seguir</button>
      <p class="texto-secundario mt-3">Podés cambiarlo cuando quieras desde Mi cuenta.</p>
    </form>
  </main>

  <a href="https://wa.me/5491100000000" class="whatsapp"><img class="whatsapp__icono" src="img/iconos/whatsapp-blanco.svg" alt="Soporte por WhatsApp"></a>
  <p class="aviso aviso--oculto"></p>

  <script src="js/usuario.js"></script>
  <script src="js/alertas.js"></script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      // Verifica si el navegador soporta Service Workers
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker registrado correctamente'))
        .catch(err => console.log('❌ Error al registrar el SW:', err));
    }
  </script>
</body>
</html>
