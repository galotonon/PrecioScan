<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenida · PrecioScan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">

  <!-- Estilos propios -->
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#1A1A1A">

  <link rel="icon" href="img/icon-192.png" type="image/png">
</head>
<body class="fondo-oscuro">


  <main class="bienvenida">
    <img class="bienvenida__logo" src="img/logo.png" alt="PrecioScan">
    <h1 class="bienvenida__titulo">Compará y pagá menos</h1>
    <p class="bienvenida__texto">Precios de zapatillas y ropa deportiva, con el envío incluido.</p>
    <a href="login.html" class="boton boton--amarillo boton--ancho">Ingresar</a>
    <a href="registro.html" class="boton boton--borde-claro boton--ancho">Crear cuenta</a>
  </main>

  <a href="https://wa.me/5491100000000" class="whatsapp"><img class="whatsapp__icono" src="img/iconos/whatsapp-blanco.svg" alt="Soporte por WhatsApp"></a>
  <p class="aviso aviso--oculto"></p>

  <script src="js/usuario.js"></script>
  <script src="js/alertas.js"></script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      // Verifica si el navegador soporta Service Workers
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker registrado correctamente'))
        .catch(err => console.log('❌ Error al registrar el SW:', err));
    }
  </script>
</body>
</html>
