<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu carrito · PrecioScan</title>

  <!-- Tipografías de Google Fonts (Montserrat para títulos y precios, Roboto para el texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap descargado (descarga local) -->
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">

  <!-- Vinculamos la hoja de estilos (va después de Bootstrap para poder pisar sus estilos) -->
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Vinculamos el archivo manifest.json -->
  <link rel="manifest" href="manifest.json">

  <!-- Color del tema (complementa el theme_color del manifest) -->
  <meta name="theme-color" content="#1A1A1A">

  <!-- Ícono principal para navegadores -->
  <link rel="icon" href="img/icon-192.png" type="image/png">
</head>
<body>
  <!-- Simulamos que el usuario ya está en la web de la tienda -->
  <div class="navegador">
    <div class="container">
      <p class="navegador__url"><img class="navegador__icono" src="img/iconos/candado-texto.svg" alt="">tienda.com.ar/carrito</p>
    </div>
  </div>

  <main class="container contenido contenido--angosto">
    <h1 class="titulo-pagina">Tu carrito</h1>
    <p class="texto-secundario">Esta es la web de la tienda (simulada). El producto que elegiste en PrecioScan ya está en el carrito, con el mismo precio y envío.</p>
    <div class="resumen">
      <p class="resumen__linea"><span>Productos</span><span>1</span></p>
      <p class="resumen__linea"><span>Envío</span><span>Según la tienda</span></p>
      <p class="resumen__linea resumen__linea--total"><span>Total</span><span>El de PrecioScan</span></p>
    </div>
    <a href="pago.html" class="boton boton--negro boton--ancho">Ir a pagar</a>
  </main>

  <!-- Soporte por WhatsApp: botón flotante en todas las pantallas (regla del manual de marca) -->
  <a href="https://wa.me/5491100000000" class="whatsapp"><img class="whatsapp__icono" src="img/iconos/whatsapp-blanco.svg" alt="Soporte por WhatsApp"></a>

  <!-- Script para registrar el Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      // Verifica si el navegador soporta Service Workers
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker registrado correctamente'))
        .catch(err => console.log('❌ Error al registrar el SW:', err));
    }
  </script>
</body>
</html>
