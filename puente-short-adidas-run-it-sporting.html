<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Te llevamos a Sporting · PrecioScan</title>

  <!-- Tipografías de Google Fonts (Montserrat para títulos y precios, Roboto para el texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Bootstrap descargado (descarga local) -->
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">

  <!-- Vinculamos la hoja de estilos (va después de Bootstrap para poder pisar sus estilos) -->
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Vinculamos el archivo manifest.json -->
  <link rel="manifest" href="manifest.json">

  <!-- Color del tema (complementa el theme_color del manifest) -->
  <meta name="theme-color" content="#1A1A1A">

  <!-- Ícono principal para navegadores -->
  <link rel="icon" href="img/icon-192.png" type="image/png">
</head>
<body>
  <header class="encabezado">
    <div class="container">
      <div class="encabezado__fila"><a href="inicio.html" class="encabezado__logo"><img src="img/logo.png" alt="PrecioScan"></a></div>
    </div>
  </header>

  <main class="container contenido contenido--angosto">
    <h1 class="titulo-pagina text-center">Te llevamos a Sporting</h1>
    <p class="texto-secundario text-center">Vas a terminar la compra en la web de la tienda. El precio y el envío son los que viste acá.</p>

    <div class="resumen">
      <div class="resumen__producto">
        <picture>
            <source type="image/webp" srcset="img/productos/short-adidas-run-it-400.webp 400w, img/productos/short-adidas-run-it-800.webp 800w" sizes="5rem">
            <img class="resumen__foto" src="img/productos/short-adidas-run-it.jpg" alt="Short Adidas Run It">
          </picture>
        <div>
          <p class="resumen__nombre">Short Adidas Run It</p>
          <p class="texto-secundario">Vendido por Sporting</p>
        </div>
      </div>
      <p class="resumen__linea"><span>Precio</span><span>$26.500</span></p>
      <p class="resumen__linea"><span>Envío</span><span>Gratis</span></p>
      <p class="resumen__linea resumen__linea--total"><span>Total</span><span>$26.500</span></p>
    </div>

    <!-- Link externo: abre la web real de la tienda -->
    <a href="https://www.sporting.com.ar" class="boton boton--amarillo boton--ancho mb-2">Ir a Sporting<img class="boton__icono" src="img/iconos/externo-negro.svg" alt=""></a>
    <a href="producto-short-adidas-run-it.html" class="boton boton--borde boton--ancho">Elegir otra tienda</a>
  </main>

  <!-- Soporte por WhatsApp: botón flotante en todas las pantallas (regla del manual de marca) -->
  <a href="https://wa.me/5491100000000" class="whatsapp"><img class="whatsapp__icono" src="img/iconos/whatsapp-blanco.svg" alt="Soporte por WhatsApp"></a>
  <!-- Cartel de confirmación: lo muestra js/alertas.js al tocar una campanita -->
  <p class="aviso aviso--oculto"></p>

  <!-- Nuestro JavaScript: guarda los datos del usuario y las alertas -->
  <script src="js/usuario.js"></script>
  <script src="js/alertas.js"></script>

  <!-- Script para registrar el Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      // Verifica si el navegador soporta Service Workers
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('✅ Service Worker registrado correctamente'))
        .catch(err => console.log('❌ Error al registrar el SW:', err));
    }
  </script>
</body>
</html>
